components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            admin: >-
              Administrator access to organization, configuration, content, billing-engine, API-flow, and admin API-key
              resources.
            dev: Developer access to APIs, applications, subscriptions, SDK, and key-management resources.
    apiKeyAuth:
      type: apiKey
      in: header
      name: api-key
      description: >-
        Header name is configurable with config.advanced.apiKey.keyType. Generated API keys are scope checked against
        the same admin/dev route scope when scope validation is enabled.
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Authenticated browser session used by billing and portal-backed requests.
  responses:
    BadRequest:
      description: Bad request
    Unauthorized:
      description: Unauthorized
    Forbidden:
      description: Forbidden
    InternalServerError:
      description: Internal server error
